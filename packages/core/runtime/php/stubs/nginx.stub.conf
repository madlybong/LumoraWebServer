# ============================================================================
# @astrake/lumora-webserver — Enterprise Nginx / aaPanel Configuration
# ============================================================================

location ~ ^/(core|storage|templates|content|css|node_modules)(/|$) {
    deny all;
    return 403;
}

location ~ ^/(lumora\.config\.php|lumora-lock\.json|package\.json|nginx\.lumora\.conf)$ {
    deny all;
    return 403;
}

location ~ /\.(?!well-known) {
    deny all;
    return 403;
}

location ~* \.(woff2|svg|png|jpg|jpeg|webp|avif|ico|css|js)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}
