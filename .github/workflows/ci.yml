name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Typecheck · Test · Build · 12-Gate Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, mbstring, curl, openssl
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync versions
        run: bun run version:sync

      - name: Verify version consistency
        run: git diff --exit-code

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Run 12-Gate Compliance Verifier
        run: bun run verify:starter

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumora-webserver-dist
          path: packages/core/dist/
          if-no-files-found: error
          retention-days: 7
