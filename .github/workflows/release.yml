name: Release

# Triggers:
#   1. Push of a version tag (v*) — manual tag release
#   2. Push to main that modifies the VERSION file — automatic release on version bump
on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases and push tags
  id-token: write   # required for npm Trusted Publishing (OIDC) & provenance

jobs:
  release:
    name: Build · Verify · Changelog · Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, mbstring, curl, openssl
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node (npm registry auth & OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: '@astrake'

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync versions
        run: bun run version:sync

      - name: Verify clean tree
        run: git diff --exit-code

      - name: Build package
        run: bun run build

      - name: Typecheck
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Run 12-Gate Compliance Verifier
        run: bun run verify:starter

      - name: Generate changelog
        run: bun run changelog

      - name: Extract version
        id: ver
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          awk '/^## \[${{ steps.ver.outputs.version }}\]/{flag=1; next} /^## (Unreleased|\[)/{if(flag) exit} flag' \
            CHANGELOG.md > release_notes.txt
          cat release_notes.txt

      - name: Pack package
        working-directory: packages/core
        run: bun pm pack

      - name: Publish to npm
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          EXISTING=$(npm view "@astrake/lumora-webserver@${PKG_VERSION}" version --userconfig /dev/null 2>/dev/null || true)
          if [ "${EXISTING}" = "${PKG_VERSION}" ]; then
            echo "✓ @astrake/lumora-webserver@${PKG_VERSION} is already published on npm — skipping publish."
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "No NPM_TOKEN set — publishing via npm Trusted Publishing (OIDC)..."
            rm -f "${NPM_CONFIG_USERCONFIG}"
            set +e
            PUBLISH_OUT=$(npm publish *.tgz --access public --provenance 2>&1)
            PUBLISH_CODE=$?
            echo "${PUBLISH_OUT}"
            set -e
            if [ ${PUBLISH_CODE} -ne 0 ]; then
              if echo "${PUBLISH_OUT}" | grep -q "OIDC permission denied for this action"; then
                echo "Trusted Publisher is configured with 'npm stage publish' permission — staging release via OIDC..."
                set +e
                STAGE_OUT=$(npm stage publish *.tgz --access public --provenance 2>&1)
                STAGE_CODE=$?
                echo "${STAGE_OUT}"
                set -e
                if [ ${STAGE_CODE} -ne 0 ]; then
                  if echo "${STAGE_OUT}" | grep -q "Cannot stage previously published version"; then
                    echo "✓ @astrake/lumora-webserver@${PKG_VERSION} is already staged on npm — skipping duplicate stage."
                  else
                    exit ${STAGE_CODE}
                  fi
                fi
              else
                exit ${PUBLISH_CODE}
              fi
            fi
          else
            npm publish *.tgz --access public --provenance
          fi

      - name: Configure git for tagging
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changelog update
        run: |
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(release): update CHANGELOG for v${{ steps.ver.outputs.version }}"

      - name: Create and push version tag
        # Only create a new tag if not already triggered by a tag push
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git tag -f "v${{ steps.ver.outputs.version }}"
          git push -f origin "v${{ steps.ver.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          name: "v${{ steps.ver.outputs.version }}"
          body_path: release_notes.txt
          files: packages/core/*.tgz
          token: ${{ secrets.GITHUB_TOKEN }}
